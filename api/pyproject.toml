[project]
name = "carboniq-api"
version = "0.1.0"
description = "FastAPI backend for CarbonIQ SME Emission Detector & Circular Recommender"
authors = [
    { name = "HackOut Team" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.28",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
    "alembic>=1.13.1",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "openpyxl>=3.1.2",
    "google-genai>=0.2.0",
    "pypdf>=4.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
